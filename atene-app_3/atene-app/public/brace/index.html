<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14090f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brace">
<title>Brace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app, a single card centred like a hand of cards on a dark velvet table */
:root{
  --bg:#1a0f14;          /* velluto prugna scuro */
  --bg2:#2a1820;
  --ink:#f6e9ea;
  --muted:#b9a0a7;
  --ember:#ff6a3d;       /* brace */
  --rose:#e8476b;
  --gold:#f3c477;
  --card:#fbf3ee;
  --card-ink:#2a1219;
  --line:rgba(246,233,234,.14);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 110%, #4a1a26 0%, transparent 60%),
                   radial-gradient(80% 50% at 50% -10%, #2f1520 0%, transparent 70%);
  color:var(--ink);font-family:var(--body);font-size:16px;
  overflow:hidden;
}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 20px; box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- setup ---------- */
.setup{flex:1;display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding-bottom:8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,16vw,76px);letter-spacing:-.04em;line-height:.9;margin:0;
  background:linear-gradient(180deg,var(--gold) 0%,var(--ember) 55%,var(--rose) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .ember{width:14px;height:14px;border-radius:50%;background:var(--ember);box-shadow:0 0 18px 6px rgba(255,106,61,.55);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 28px 10px rgba(232,71,107,.5);transform:scale(.85)}}
.lede{color:var(--muted);margin:-8px 0 0;line-height:1.5;max-width:34ch}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font:500 16px var(--body);width:100%;box-sizing:border-box}
.field input::placeholder{color:#7d6168}
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);transition:border-color .2s, background .2s}
.lvl .fl{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;color:var(--ember);min-width:56px}
.lvl b{font-family:var(--display);font-size:19px;font-weight:700}
.lvl span{color:var(--muted);font-size:14px}
.lvl[aria-pressed="true"]{border-color:var(--ember);background:linear-gradient(90deg,rgba(255,106,61,.16),rgba(232,71,107,.06))}
.cta{margin-top:auto;padding:17px;border-radius:999px;background:linear-gradient(90deg,var(--ember),var(--rose));color:#fff;font:700 18px var(--display);letter-spacing:-.01em;box-shadow:0 10px 30px -10px rgba(232,71,107,.7)}
.cta:active{transform:scale(.98)}
.fine{font-size:12px;color:#8a6e75;text-align:center;margin:0}

/* ---------- game ---------- */
.game{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;background:var(--bg2)}
.chip .dot{color:var(--ember)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.turn{text-align:center;display:flex;flex-direction:column;gap:2px}
.turn small{color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.turn strong{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.score{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted)}
.score b{color:var(--gold);font-variant-numeric:tabular-nums}

.table{flex:1;min-height:0;display:grid;place-items:center;perspective:1400px;position:relative}
.stack{position:absolute;width:min(100%,360px);aspect-ratio:5/7;max-height:100%;border-radius:22px;background:#3a1d27;border:1px solid var(--line)}
.stack.s1{transform:translate(6px,8px) rotate(3deg)}
.stack.s2{transform:translate(-5px,12px) rotate(-3deg);background:#311820}
.card{position:relative;width:min(100%,360px);aspect-ratio:5/7;max-height:100%;max-width:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card.out{animation:out .38s ease-in forwards}
.card.in{animation:in .42s cubic-bezier(.2,.8,.2,1)}
@keyframes out{to{transform:rotateY(180deg) translateX(-130%) rotate(-14deg);opacity:0}}
@keyframes in{from{transform:translateY(30px) scale(.94);opacity:0}}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.back{background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),
   linear-gradient(160deg,#c43a58 0%,#7c1f36 60%,#4c1424 100%);
  display:grid;place-items:center;border:6px solid #fbf3ee}
.back .seal{width:46%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(251,243,238,.7);display:grid;place-items:center;text-align:center}
.back .seal span{font-family:var(--display);font-weight:800;font-size:30px;color:#fbf3ee;letter-spacing:-.03em}
.back .hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:rgba(251,243,238,.8);letter-spacing:.12em;text-transform:uppercase}
.front{transform:rotateY(180deg);background:var(--card);color:var(--card-ink);display:flex;flex-direction:column;padding:26px 24px;box-sizing:border-box;gap:14px}
.front .kind{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.front .kind .tag{padding:6px 10px;border-radius:999px;color:#fff}
.tag.domanda{background:#7c1f36}.tag.sfida{background:#d9472a}.tag.confessione{background:#5b2a6e}.tag.scelta{background:#a3631b}
.front .heat{color:var(--rose);font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.front p{margin:auto 0;font-family:var(--display);font-weight:700;font-size:clamp(22px,6.2vw,29px);line-height:1.18;letter-spacing:-.015em;text-wrap:balance}
.front p em{font-style:normal;color:#c43a58}
.front .foot{font-size:13px;color:#8a5a66;display:flex;justify-content:space-between}

.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{padding:15px 12px;border-radius:999px;font-weight:700;font-family:var(--display);font-size:17px}
.btn.ghost{border:1px solid var(--line);background:var(--bg2)}
.btn.main{background:linear-gradient(90deg,var(--ember),var(--rose));color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.links{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.links button{text-decoration:underline;text-underline-offset:3px;color:var(--muted)}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,6,10,.82);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:26px 22px;max-width:380px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;text-align:center}
.sheet h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;color:var(--gold);letter-spacing:-.02em}
.sheet p{margin:0;line-height:1.5;color:var(--ink);font-size:17px}
.sheet .sub{color:var(--muted);font-size:14px}

/* ---------- v2: modalità, giocatori, carte personali ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.seg button{padding:10px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .field{flex:1}
.x{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-size:20px;line-height:1}
.add{align-self:flex-start;padding:9px 14px;border-radius:999px;border:1px dashed rgba(246,233,234,.3);color:var(--muted);font-weight:600;font-size:14px}
.custom-btn{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1px dashed rgba(243,196,119,.45);color:var(--gold);font-weight:600;text-align:left}
.custom-btn span{color:var(--muted);font-weight:500;font-size:14px}
.sheet.editor{text-align:left;max-height:88vh;overflow-y:auto}
.sheet textarea,.sheet select{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:500 16px var(--body)}
.sheet textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins{font-size:13px;color:var(--gold);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.clist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.clist li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;line-height:1.4}
.clist li div{flex:1;min-width:0;overflow-wrap:anywhere}
.clist li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.clist li button{color:var(--muted);font-size:13px;text-decoration:underline}
.empty{color:var(--muted);font-size:14px;margin:0}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{flex-wrap:wrap;gap:4px 16px}
.mine{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a3631b;font-weight:700}

@media (prefers-reduced-motion:reduce){
  .card,.card.in,.card.out,.brand .ember{transition:none;animation:none}
}
/* ---------- v3: online ---------- */
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
[hidden]{display:none!important}
.cta-row{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.cta-row .cta{margin-top:0}
.cta:disabled{opacity:.5;cursor:default;box-shadow:none}
.err{margin:0;padding:12px 14px;border-radius:12px;background:rgba(232,71,107,.14);border:1px solid rgba(232,71,107,.5);color:var(--ink);line-height:1.45}
.box{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg2)}
.box b{font-family:var(--display);font-size:19px}
.sub{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.join{display:grid;grid-template-columns:1fr auto;gap:8px}
.code-in{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:800 22px var(--display);letter-spacing:.3em;text-transform:uppercase;min-width:0;width:100%}
.join .btn{padding-inline:22px}
.room-code{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,96px);letter-spacing:.12em;line-height:1;color:var(--gold)}
.share{display:grid;grid-template-columns:1fr auto;gap:8px}
.share input{min-width:0;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);font:500 14px var(--body)}
.share .btn{font-size:15px;padding-inline:16px}
.who{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.who li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600}
.who small{color:var(--muted);font-weight:500}
.wait{text-align:center;color:var(--muted);margin:0;padding:15px 0;font-size:15px}
.net{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:#f3c477;color:#2a1219;font:600 14px var(--body);box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
.resume{text-align:left;border-color:rgba(243,196,119,.6)!important;cursor:pointer}
.resume b{color:var(--gold)}
.wa{display:block;text-align:center;text-decoration:none;color:var(--ink)}
.ios-hint{border-color:rgba(79,168,255,.45)!important}
.ios-hint b{color:var(--ink)}
.score span.off{opacity:.55;border-style:dashed}
/* ---------- v4: chat ---------- */
.links{flex-wrap:wrap;gap:8px 16px;align-items:center}
.chat-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)!important;text-decoration:none!important;font-weight:600;font-size:14px}
.chat-btn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--bg);font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.chat{position:fixed;left:0;right:0;bottom:0;z-index:30;height:min(72vh,580px);display:flex;flex-direction:column;gap:10px;
  background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.55);
  padding-top:14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.chat-inner{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px}
.chat-head b{font-family:var(--display);font-size:20px}
.chat-head span{color:var(--muted);font-size:13px;flex:1}
.chat-head button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);font-size:22px;color:var(--muted)}
.chat-list{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:4px 2px;display:flex;flex-direction:column;gap:8px}
.chat-list li{max-width:80%;display:flex;flex-direction:column;gap:2px;align-self:flex-start}
.chat-list li small{color:var(--muted);font-size:12px;padding:0 4px}
.chat-list li p{margin:0;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bg);border:1px solid var(--line);line-height:1.4;overflow-wrap:anywhere;font-size:15px}
.chat-list li.me{align-self:flex-end;align-items:flex-end}
.chat-list li.me p{background:linear-gradient(90deg,var(--ember),var(--rose));border-color:transparent;color:#fff;border-radius:16px 16px 4px 16px}
.chat-list li.big p{font-size:30px;background:none;border:0;padding:0 4px}
.chat-empty{color:var(--muted);font-size:14px;text-align:center;margin:auto 0}
.chat-quick{display:flex;gap:8px;overflow-x:auto}
.chat-quick button{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:20px;background:var(--bg)}
.chat-form{display:grid;grid-template-columns:1fr auto;gap:8px}
.chat-form input{min-width:0;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ink);font:500 16px var(--body)}
.chat-form .btn{padding:12px 18px;font-size:16px}

/* ---------- v5: grafica e Lei/Lui ---------- */
:root{--lei:#ff5c9a;--lui:#4fa8ff;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1)}
body{background:#14090f}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 25%,rgba(255,92,154,.28),transparent 70%),
             radial-gradient(45% 40% at 85% 70%,rgba(255,106,61,.26),transparent 70%),
             radial-gradient(50% 40% at 50% 110%,rgba(140,40,90,.5),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(6deg) scale(1.06)}}
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.brand{align-items:center;gap:12px}
.brand .logo{width:46px;height:60px;flex:none;filter:drop-shadow(0 0 16px rgba(255,106,61,.75));animation:flicker 3s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.06,1.1) rotate(2deg)}}
.brand h1{background:linear-gradient(100deg,#ffd38a 0%,#ff8a4c 30%,#ff4f8b 55%,#ffd38a 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  animation:shine 6s linear infinite;filter:drop-shadow(0 4px 24px rgba(255,79,139,.35))}
@keyframes shine{to{background-position:-220% 0}}
.brand .ember{display:none}
.lede{color:#d9c3c9}
.seg{background:var(--glass);backdrop-filter:blur(10px);border-color:var(--glass2)}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--ember),var(--rose));color:#fff;box-shadow:0 6px 18px -6px rgba(232,71,107,.8)}
.lvl{background:var(--glass);backdrop-filter:blur(10px);border-color:var(--glass2);position:relative;overflow:hidden}
.lvl .fl{display:flex;gap:2px;min-width:64px}
.lvl[aria-pressed="true"]{border-color:transparent;background:linear-gradient(100deg,rgba(255,106,61,.32),rgba(255,79,139,.22));box-shadow:0 0 0 2px var(--ember) inset,0 10px 30px -12px rgba(255,79,139,.8)}
.flames{display:inline-flex;gap:1px;vertical-align:-3px}
.flames svg{width:15px;height:20px}
.lvl .flames svg{width:20px;height:26px}
.flames .off{opacity:.25}
.custom-btn{background:rgba(243,196,119,.06)}
.cta,.btn.main{background:linear-gradient(100deg,#ff8a4c,#ff4f8b 60%,#d63384);background-size:160% 100%;box-shadow:0 12px 34px -10px rgba(255,79,139,.85),inset 0 1px 0 rgba(255,255,255,.25);transition:background-position .4s,transform .1s}
.cta:hover,.btn.main:hover{background-position:100% 0}
.btn.ghost,.chip,.chat-btn{background:var(--glass);backdrop-filter:blur(10px);border-color:var(--glass2)}
.field input,.code-in,.share input{background:rgba(0,0,0,.25);border-color:var(--glass2)}
.field input:focus,.code-in:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,79,139,.25);outline:none}
/* giocatori con Lei / Lui */
.players{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;align-items:center;gap:10px;padding:8px;border-radius:18px;background:var(--glass);border:1px solid var(--glass2);backdrop-filter:blur(10px)}
.pcard.f{box-shadow:inset 4px 0 0 var(--lei)}
.pcard.m{box-shadow:inset 4px 0 0 var(--lui)}
.pcard .field{flex:1}
.pcard input{background:transparent!important;border:0!important;padding:10px 4px!important;font-weight:600!important;font-size:17px!important;box-shadow:none!important}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);color:#fff}
.av.f{background:linear-gradient(140deg,#ff8ab8,var(--lei));box-shadow:0 0 18px -4px var(--lei)}
.av.m{background:linear-gradient(140deg,#8cc8ff,var(--lui));box-shadow:0 0 18px -4px var(--lui)}
.av.sm{width:26px;height:26px;font-size:12px;box-shadow:none}
.gsw{display:grid;grid-template-columns:1fr 1fr;flex:none;padding:3px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--glass2)}

.gsw button.f[aria-pressed="true"]{background:var(--lei);color:#fff}
.gsw button.m[aria-pressed="true"]{background:var(--lui);color:#fff}
.pcard .x{width:36px;height:36px;border-radius:50%;border-color:var(--glass2)}
.hint-g{font-size:13px;color:var(--muted);margin:6px 0 0}

.turn{flex-direction:row;justify-content:center;align-items:center;gap:12px}
.turn .who-turn{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.turn .to{font-size:14px;color:#d9c3c9;font-weight:500}
.turn .to b{font-weight:700}
.stack{background:linear-gradient(160deg,#5a1f38,#2b1020);border-color:var(--glass2)}
.back{background:
   radial-gradient(60% 45% at 50% 42%,rgba(255,170,90,.45),transparent 70%),
   repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 16px),
   linear-gradient(165deg,#ff4f8b 0%,#b0234f 45%,#4a0f2a 100%);
  border:0;box-shadow:inset 0 0 0 8px #1f0a14,inset 0 0 0 10px #f3c477,0 30px 60px -20px rgba(0,0,0,.8)}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.back .seal{width:52%;border:2px solid rgba(243,196,119,.8);background:rgba(31,10,20,.35);backdrop-filter:blur(2px);display:flex;flex-direction:column;gap:4px;box-shadow:0 0 40px rgba(255,138,76,.35)}
.back .seal svg{width:38%;height:auto;filter:drop-shadow(0 0 10px rgba(255,170,90,.9))}
.back .seal span{font-size:26px;color:#ffe4b8}
.back .hint{color:#ffe4b8;font-weight:600}
.front{padding:0;gap:0;background:#fff8f3}
.front .band{padding:20px 22px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.front .band.domanda{background:linear-gradient(120deg,#c2185b,#7b1f4b)}
.front .band.sfida{background:linear-gradient(120deg,#ff6a3d,#e8336b)}
.front .band.confessione{background:linear-gradient(120deg,#8e44ad,#4a1f6e)}
.front .band.scelta{background:linear-gradient(120deg,#f39c12,#c0571b)}
.front .band .tag{background:rgba(255,255,255,.22)!important;padding:6px 12px;border-radius:999px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.front .band .flames svg{filter:brightness(1.6) saturate(.6)}
.front .body{flex:1;display:flex;flex-direction:column;padding:16px 24px 22px;position:relative}
.front .body::before{content:"“";position:absolute;top:-6px;left:16px;font:800 90px/1 var(--display);color:rgba(194,24,91,.12)}
.front p{position:relative}
.front p em{color:#c2185b;background:linear-gradient(transparent 62%,rgba(255,92,154,.22) 62%)}
.front p em.m{color:#1f6fd1;background:linear-gradient(transparent 62%,rgba(79,168,255,.22) 62%)}
.front .foot{align-items:center;gap:8px;color:#8a5a66}
.front .foot .pair{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.front .mine{color:#fff;background:rgba(0,0,0,.2);padding:4px 8px;border-radius:999px}
.score{gap:6px 10px}
.score{font-size:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.score span{justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.score span{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass2)}

.room-code{background:linear-gradient(100deg,#ffd38a,#ff8a4c 50%,#ff4f8b);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{background:var(--glass);border-color:var(--glass2);backdrop-filter:blur(10px)}
.sheet{background:linear-gradient(170deg,#2f1422,#1a0b13);border-color:var(--glass2);box-shadow:0 30px 80px -20px rgba(255,79,139,.4)}
.chat{background:linear-gradient(175deg,#2a1220,#170910)}

.table{container-type:size;overflow:visible}
@supports (height:1cqh){
  .card,.stack{width:auto;max-width:none;max-height:none;aspect-ratio:5/7;height:min(100cqh,504px,calc(100cqw * 1.4))}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rnd(n){return Math.floor(Math.random()*n)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const GB={"fagli/le":["fagli","falle"],"dagli/le":["dagli","dalle"],"fargli/le":["fargli","farle"],"gli/le":["gli","le"],"lui/lei":["lui","lei"],"lo/la":["lo","la"]};
function gender(t,A,B){
  return String(t).replace(/([A-Za-zàèéìòù]*)\/(lei|le|la|a)\b/g,(m,w,suf)=>{
    const key=(w+"/"+suf).toLowerCase();
    if(GB[key]) return B&&B.g?GB[key][B.g==="f"?1:0]:m;
    if(suf==="a"&&/o$/.test(w)){
      const p=(/lo$/.test(w)||w==="abbracciato")?B:A;
      if(!p||!p.g) return m;
      return p.g==="f"?w.slice(0,-1)+"a":w;
    }
    return m;
  });
}

/* ---------------- motore di gioco ---------------- */
function poolFor(g,l){
  const base=(g.mode==="coppia"?COPPIA:GRUPPO)[l].map(c=>({k:c[0],t:c[1],l}));
  const mine=U.custom.filter(c=>c.level===l).map(c=>({k:c.kind,t:c.text,l,mine:true}));
  return base.concat(mine);
}
function newDeck(g){
  g.deck=g.level===4?[1,2,3].flatMap(l=>shuffle(poolFor(g,l)).slice(0,10)):shuffle(poolFor(g,g.level));
  g.i=0;g.flipped=false;g.cur=null;
  g.vd=g.deck.filter(c=>c.k!=="sfida");g.od=g.deck.filter(c=>c.k==="sfida");
  g.seq++;
}
function refill(g,kind){
  const base=g.level===4?[1,2,3].flatMap(l=>poolFor(g,l)):poolFor(g,g.level);
  return shuffle(base.filter(c=>(c.k==="sfida")===(kind==="o")));
}
function pickTarget(g){
  const n=g.players.length;
  if(n<2){g.target=g.turn;return}
  if(n===2){g.target=1-g.turn;return}
  let t;do{t=rnd(n)}while(t===g.turn);g.target=t;
}
function makeGame(players){
  const g={mode:U.mode,level:U.level,style:U.style,players,turn:0,target:0,
    done:players.map(()=>0),passes:players.map(()=>0),overlay:null,seq:0};
  newDeck(g);pickTarget(g);return g;
}
const cardOf=g=>g.style==="oov"?g.cur:g.deck[g.i];

function nextCard(g){
  const n=g.players.length||1;
  g.flipped=false;g.turn=(g.turn+1)%n;pickTarget(g);g.seq++;
  if(g.style==="oov"){g.cur=null;if(g.vd.length||g.od.length)return}
  else{g.i++;if(g.i<g.deck.length)return}
  const up=g.level<3, nextL=up?g.level+1:g.level;
  g.overlay={kind:"end",nextL,title:"Mazzo finito",
    text:up?`Avete giocato tutte le carte di ${LEVELS[g.level].name}. Pronti per ${LEVELS[nextL].name}?`:"Avete giocato tutto il mazzo. Si ricomincia?",
    btn:up?"Alza il fuoco":"Rimescola"};
  if(g.style!=="oov") g.i=g.deck.length-1;
}
function act(g,type){
  const oov=g.style==="oov";
  if(g.overlay){
    if(type!=="ok") return;
    const o=g.overlay;g.overlay=null;
    if(o.kind==="pegno") nextCard(g);
    else if(o.kind==="end"){g.level=o.nextL;newDeck(g)}
    return;
  }
  if(type==="flip"){ if(!oov&&!g.flipped) g.flipped=true; return }
  if(type==="pickV"||type==="pickO"){
    if(!oov||g.cur) return;
    const kind=type==="pickO"?"o":"v";
    let arr=kind==="o"?g.od:g.vd;
    if(!arr.length){arr=refill(g,kind);if(kind==="o")g.od=arr;else g.vd=arr}
    if(arr.length){g.cur=arr.shift();g.flipped=true;g.seq++}
    return;
  }
  if(type==="done"||type==="pass"){
    if(!g.flipped) return;
    const who=g.turn,P=g.players;
    if(type==="pass"){
      g.passes[who]++;
      if(g.passes[who]%3===0){
        const list=PEGNI[g.mode];
        const B=P.length===2?P[1-who].name:P[(who+1+rnd(P.length-1))%P.length].name;
        g.overlay={kind:"pegno",title:"Pegno per "+P[who].name,text:list[rnd(list.length)],who:B,sub:"Tre «passo» si pagano.",btn:"Pagato"};
        return;
      }
    } else g.done[who]++;
    nextCard(g);return;
  }
  if(type==="shuffle"){newDeck(g);return}
  if(type==="level"){g.level=g.level%4+1;newDeck(g);return}
}
function snapshot(g){
  return {started:true,mode:g.mode,level:g.level,style:g.style,players:g.players,turn:g.turn,target:g.target,
    card:cardOf(g)||null,flipped:g.flipped,seq:g.seq,i:g.i,n:g.deck.length,vdn:g.vd.length,odn:g.od.length,
    done:g.done,passes:g.passes,overlay:g.overlay};
}

let sb=null;
function client(){
  if(window.__braceTransport) return window.__braceTransport;
  if(sb) return sb;
  if(!window.supabase||!window.supabase.createClient) return null;
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  return sb;
}
function isHost(){return !!(U.online&&U.online.host)}
function newCode(){let c="";for(let i=0;i<4;i++)c+=CODE_CHARS[rnd(CODE_CHARS.length)];return c}

const AWAY_MS=300000;   // dopo 5 minuti offline un giocatore esce dalla partita
function saveRoom(){
  const o=U.online; if(!o) return;
  store.set("room",{code:o.code,host:o.host,name:o.name,joinedAt:o.joinedAt,at:Date.now(),G:o.host&&G?G:null});
}
function savedRoom(){
  const r=store.get("room",null);
  if(!r||typeof r!=="object"||!/^[A-Z]{4}$/.test(r.code||"")||Date.now()-(+r.at||0)>3*3600e3) return null;
  return r;
}
function joinRoom(code,host,resume){
  const name=U.myName.trim();
  if(!name){U.err="Scrivi il tuo nome per entrare.";render();return}
  store.set("myname",name);
  const c=client();
  if(!c){U.err="Il gioco online non si è caricato. Controlla la connessione e ricarica la pagina.";render();return}
  U.err="";U.present=[];U.snap=null;G=(resume&&resume.G)||null;U.lastSeq=-1;U.chat=[];U.unread=0;closeChat();
  U.online={code,host,ch:null,name,joinedAt:(resume&&+resume.joinedAt)||Date.now(),connected:false,everConnected:false,
    hostSeen:host||!!resume,hostGoneAt:0,hostName:"",away:{},retry:0,reconnectTimer:null};
  openChannel();
  const o=U.online;
  if(!host&&!resume) setTimeout(()=>{ if(U.online===o&&!o.hostSeen){o.slowHost=true;render()} },15000);
  try{history.replaceState(null,"","#"+code)}catch(e){}
  U.screen="lobby";saveRoom();render();
}
function openChannel(){
  const o=U.online, c=client(); if(!o||!c) return;
  if(o.reconnectTimer){clearTimeout(o.reconnectTimer);o.reconnectTimer=null}
  if(o.ch){const old=o.ch;o.ch=null;try{old.unsubscribe();c.removeChannel&&c.removeChannel(old)}catch(e){}}
  const ch=c.channel("brace-"+o.code,{config:{broadcast:{self:false},presence:{key:myId}}});
  o.ch=ch;
  ch.on("broadcast",{event:"state"},({payload})=>{
      if(isHost()||!payload||typeof payload!=="object") return;
      U.snap=payload;o.hostSeen=true;o.hostGoneAt=0;render();
    })
    .on("broadcast",{event:"act"},({payload})=>{ if(isHost()&&payload) hostAct(String(payload.from),String(payload.type)) })
    .on("broadcast",{event:"hello"},()=>{ if(isHost()){ broadcastState(); if(U.chat.length) ch.send({type:"broadcast",event:"chatlog",payload:{msgs:U.chat.slice(-50)}}) } })
    .on("broadcast",{event:"chat"},({payload})=>addMsg(payload))
    .on("broadcast",{event:"chatlog"},({payload})=>{ if(isHost()||!payload||!Array.isArray(payload.msgs)) return; payload.msgs.forEach(m=>addMsg(m,true)); U.unread=0; updateBadge() })
    .on("presence",{event:"sync"},()=>{ if(U.online===o&&o.ch===ch) onPresence(ch.presenceState()) })
    .subscribe(async status=>{
      if(U.online!==o||o.ch!==ch) return;
      if(status==="SUBSCRIBED"){
        o.connected=true;o.everConnected=true;o.retry=0;
        if(o.hostGoneAt) o.hostGoneAt=Date.now();
        o.away={};
        await ch.track({name:o.name.slice(0,16),g:U.myGender,host:o.host,at:o.joinedAt});
        if(o.host) broadcastState(); else ch.send({type:"broadcast",event:"hello",payload:{}});
        render();
      } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
        o.connected=false;
        scheduleReconnect();render();
      }
    });
}
function scheduleReconnect(){
  const o=U.online; if(!o||o.reconnectTimer) return;
  o.retry++;
  o.reconnectTimer=setTimeout(()=>{o.reconnectTimer=null;if(U.online===o&&!o.connected)openChannel()},Math.min(10000,1500*o.retry));
}
function leaveRoom(){
  const o=U.online;U.online=null;G=null;U.snap=null;U.present=[];U.chat=[];U.unread=0;closeChat();
  store.set("room",null);
  if(o){ if(o.reconnectTimer)clearTimeout(o.reconnectTimer);
    if(o.ch){try{o.ch.untrack();o.ch.unsubscribe();const c=client();c&&c.removeChannel&&c.removeChannel(o.ch)}catch(e){}} }
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  U.screen=U.err?"online":"setup";render();
}
function removePlayer(k){
  const wasTurn=k===G.turn;
  G.players.splice(k,1);G.done.splice(k,1);G.passes.splice(k,1);
  if(k<G.turn) G.turn--;
  if(G.players.length) G.turn%=G.players.length;
  if(wasTurn){G.flipped=false;if(G.style==="oov")G.cur=null;G.seq++}
}
function onPresence(state){
  const o=U.online; if(!o) return;
  const list=Object.entries(state||{}).map(([id,arr])=>{const m=(arr&&arr[0])||{};return {id,name:String(m.name||"Ospite").slice(0,16),g:m.g==="m"?"m":"f",host:!!m.host,at:+m.at||0}})
    .sort((a,b)=>a.at-b.at);
  U.present=list;
  if(o.host){
    if(G){
      const ids=new Set(list.map(p=>p.id));ids.add(myId);
      const now=Date.now();let added=false;
      for(const p of G.players){
        if(ids.has(p.id)){delete o.away[p.id];p.away=false}
        else{if(!o.away[p.id])o.away[p.id]=now;p.away=true}
      }
      for(const p of list) if(!G.players.some(x=>x.id===p.id)){G.players.push({id:p.id,name:p.name,g:p.g,away:false});G.done.push(0);G.passes.push(0);added=true}
      if(added) pickTarget(G);
    }
    broadcastState();
  } else {
    const h=list.find(p=>p.host);
    if(h){o.hostSeen=true;o.hostGoneAt=0;o.hostName=h.name}
    else if(o.hostSeen&&o.connected&&!o.hostGoneAt) o.hostGoneAt=Date.now();
  }
  render();
}
/* controlli periodici: chi resta offline troppo a lungo esce */
setInterval(()=>{
  const o=U.online; if(!o||!o.connected) return;
  if(o.host&&G){
    let changed=false;
    for(let k=G.players.length-1;k>=0;k--){
      const p=G.players[k], since=o.away[p.id];
      if(p.id!==myId&&since&&Date.now()-since>AWAY_MS){removePlayer(k);delete o.away[p.id];changed=true}
    }
    if(changed){pickTarget(G);broadcastState();render()}
  }
},3000);

function wake(){
  const o=U.online; if(!o) return;
  if(!o.connected) openChannel();
  else if(o.host) broadcastState();
  else o.ch.send({type:"broadcast",event:"hello",payload:{}});
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wake() });
addEventListener("pageshow",e=>{ if(e.persisted) wake() });
addEventListener("online",wake);

function broadcastState(){
  if(!isHost()) return;
  const s=G?snapshot(G):lobbySnap();
  s.hostId=myId;U.snap=s;saveRoom();
  if(U.online.connected&&U.online.ch) U.online.ch.send({type:"broadcast",event:"state",payload:s});
}
function hostAct(from,type){
  if(!G) return;
  const turnId=G.players[G.turn]&&G.players[G.turn].id;
  if(!["flip","pickV","pickO","done","pass","ok","shuffle","level"].includes(type)) return;
  if(type==="shuffle"||type==="level"){ if(from!==myId) return }
  else if(from!==turnId) return;
  act(G,type);broadcastState();render();
}
function hostStart(){
  if(!isHost()||U.present.length<2) return;
  G=makeGame(U.present.map(p=>({id:p.id,name:p.name,g:p.g,away:false})));
  broadcastState();render();
}
function netStatus(){
  const o=U.online; if(!o) return "";
  if(!o.connected) return o.everConnected?"Connessione persa. Mi ricollego…":"Mi collego alla stanza…";
  if(!o.host&&o.hostGoneAt) return `${o.hostName||"Chi ha creato la stanza"} è uscito dall'app. Aspettiamo che torni…`;
  return "";
}
function updateNet(){const n=document.getElementById("net");if(!n)return;const t=netStatus();n.textContent=t;n.hidden=!t}

        <div class="face front">${c?`
          <div class="band ${tagClass}"><span class="tag">${kindLabel}</span>${c.mine?`<span class="mine">Tua</span>`:""}<span class="heat">${CL.fl}</span></div>
          <div class="body"><p>${fill(c.t,turnP,targetP)}</p>

    </div>
    ${!canAct&&turnP.away?`<p class="wait">${esc(turnP.name)} è offline. Aspettiamo che torni…</p>`:!canAct?`<p class="wait">${s.flipped?`${esc(turnP.name)} sta giocando la carta…`:`${esc(turnP.name)} sta scegliendo…`}</p>`
    :oov&&!s.flipped?`<div class="actions" style="grid-template-columns:1fr 1fr">
      <button class="btn ghost" id="pickV">Verità</button>
      <button class="btn main" id="pickO">Obbligo</button>

      <button class="btn ghost" id="pass" ${s.flipped?"":"disabled"}>Passo</button>

function addMsg(raw,quiet){

/* braci che salgono sullo sfondo */
(function(){
  const c=document.getElementById("embers");
  if(!c||!c.getContext||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x=c.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);let w=0,h=0;
  const size=()=>{w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr};size();addEventListener("resize",size);
  const spawn=any=>({x:Math.random()*w,y:any?Math.random()*h:h+20,r:(Math.random()*1.8+.6)*dpr,v:(Math.random()*.5+.2)*dpr,d:Math.random()*6.3,hue:Math.random()<.55?18:338,a:Math.random()*.5+.3});
  const ps=Array.from({length:34},()=>spawn(true));
  (function tick(){
    x.clearRect(0,0,w,h);
    for(const p of ps){
      p.y-=p.v;p.d+=.012;p.x+=Math.sin(p.d)*.35*dpr;
      if(p.y<-20) Object.assign(p,spawn(false));
      const fade=Math.min(1,p.y/(h*.35));
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,`hsla(${p.hue},100%,70%,${p.a*fade})`);g.addColorStop(1,`hsla(${p.hue},100%,55%,0)`);
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*5,0,6.3);x.fill();
    }
    requestAnimationFrame(tick);
  })();
})();

/* link diretto a una stanza: …/brace/#ABCD. Se è la stanza in cui eri, rientri da solo */
(function(){
  const m=/^#([A-Za-z]{4})$/.exec(location.hash||"");
  if(!m) return;
  const code=m[1].toUpperCase(), r=savedRoom();
  if(r&&r.code===code&&r.name){ setTimeout(resumeRoom,0); return }
  U.codeInput=code;U.screen="online";
})();
render();
</script>
